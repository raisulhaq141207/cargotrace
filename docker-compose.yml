services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cargotrace-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - cargotrace-network

  webserver:
    image: nginx:alpine
    container_name: cargotrace-web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/conf.d/:/etc/nginx/conf.d/
    networks:
      - cargotrace-network

networks:
  cargotrace-network:
    driver: bridge

